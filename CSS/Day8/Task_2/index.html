<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
        <form action="">
            <label for="Name">Name :</label>
            <input type="text" name="Name" id="" placeholder="Enter your name" required> <br>

            <label for="Email">Email :</label>
            <input type="email" name="Email" id="" placeholder="Enter your email" required><br>

            <label for="password">Password :</label>
            <input type="password" name="password" id="" placeholder="Enter your password" required><br>

            <label for="mobile">Mobile :</label>
            <input type="tel" name="mobile" id="" placeholder="Enter your mobile number" required><br>

            <input type="submit" value="Apply">
        </form>
</body>
</html>
