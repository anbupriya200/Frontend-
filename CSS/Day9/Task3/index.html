<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div>
        <h3>The Perfume</h3>
        <div class="box">
            <div class="card">
                <img src="assets/image/perfume1.jpg" alt="perfume1">
                <div class="content">
                    <p>Classic BLue Edition Luxury Perfume</p>
                    <p>$235</p>
                    <button>BUY</button>
                </div>
            </div>

            <div class="card">
                <img src="assets/image/perfume2.webp" alt="perfume2">
                <div class="content">
                    <p>Og luxury Solace De Perfume</p>
                    <p>$230</p>
                    <button>BUY</button>
                </div>
            </div>

            <div class="card">
                <img src="assets/image/perfume3.webp" alt="perfume3">
                <div class="content">
                    <p>Sandal Veer</p>
                    <p>$1999</p>
                    <button>BUY</button>
                </div>
            </div>

            <div class="card">
                <img src="assets/image/perfume.jpg" alt="perfume4">
                <div class="content">
                    <p>CK One EDP foe men & women</p>
                    <p>$999</p>
                    <button>BUY</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
