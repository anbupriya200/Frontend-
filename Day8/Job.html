<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
</head>
<body>
    <center>
    <main style="background-color: rgb(199, 197, 78);">
        <div>
            <h3>Job Application Form</h3>
            <form action="" method="post">
                <h3>PERSONAL INFORMATION</h3>
                <label for="username">Full Name</label>
                <input type="text" name="username" placeholder="Enter your name"><br><br>
                <label for="useraddress">Address</label>
                <input type="text" name="useraddress" placeholder="Enter your Address"><br><br>
                <label for="usermobile">Mobile Number  :</label>
                <input type="tel" name="usermobile" placeholder="Enter your mobile number"><br><br>
                <label for="">Email id  :</label>
                <input type="email" name="useremail" placeholder="Enter your email id"><br><br>
            </form>
        </div>
        <div>
            <h3>EDUCATION</h3>
            <form action="" method="post">
                <label for="school">School/Institution  :</label>
                <input type="text" name="school" placeholder="Enter your School/Institution"><br><br>
                <label for="Degree">Degree/Certification  :</label>
                <input type="text" name="Degree" placeholder="Enter your Degree/Certification"><br><br>
                <label for="Year">Year Completed  :</label>
                <input type="text" name="Year" placeholder="Enter your Year Completed"><br><br>
            </form>
        </div>
        <div>
            <h3>RECENT EMPLOYMENTT HISTORY</h3>
            <form action="" method="post">
              <label for="Campany">Campany Name  :</label>
                <input type="text" name="Campany" placeholder="Enter your Campany Name"><br><br>  
                <label for="Position">Position Held  :</label>
                <input type="text" name="Position" placeholder="Enter your Position Held"><br><br> 
                <label for="Employment">Employment Dates  :</label>
                <input type="text" name="Employment" placeholder="Enter your Employment Dates"><br><br>  
            </form>
        </div>
        <div>
            <h3>SKILLS & QUALIICATION</h3>
            <form action="" method="post">
                <label for="skills">List relevant kills,certification or qualification</label>
                <textarea name="skills" id="" width="170"></textarea>
            </form>
        </div>
        <div>
            <h3>RECENT EMPLOYMENT HISTORY</h3>
            <form action="" method="post">
                <label for="reference">Reference Name  :</label>
                <input type="text" name="reference" placeholder="Enter your Reference Name"><br><br>  
                <label for="Relationship">Relationship  :</label>
                <input type="text" name="reference" placeholder="Enter your Relationship"><br><br>  
                <label for="usermobile">Mobile Number  :</label>
                <input type="tel" name="usermobile" placeholder="Enter  mobile number"><br><br>
                <input type="submit" value="submit">

            </form>
        </div>
    </main>
    </center>
</body>
</html>
