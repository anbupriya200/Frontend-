<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
   <center>
    <main>
       <div style="background-color: rgb(215, 154, 233);">
        <h2>Registration Form</h2>
        <form action="" method="post">
         <label for="username">Student Name  :</label>
         <input type="text" placeholder="Enter your name" required><br><br>
         <label for="username">Father Name  :</label>
         <input type="text" placeholder="Enter your fathername" required><br><br>
         <label for="DOB">Date of birth :</label>
         <input type="date" name="date" ><br><br>
         <label for="usermobile">Mobile Number  :</label>
         <input type="tel" name="usermobile" placeholder="Enter your mobile number"><br><br>
         <label for="">Email id  :</label>
         <input type="email" name="useremail" placeholder="Enter your email id"><br><br>
         <label for="userpassword">Password  :</label>
         <input type="password" name="userpassword" placeholder="Enter the ppassword"><br><br>
         <label for="Gender">Gender  :</label>
         <input type="radio" name="Gender">Male
         <input type="radio" name="Gender">Female <br><br>
         <label for="">Course  :</label>
         <select name="" id="">
            <option value="">select current course</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="REACT">REACT</option>
            <option value="JS">JS</option>
         </select><br><br>
         <label for="usercity">City  :</label>
         <input type="text" placeholder="Enter your city"><br><br>
         <label for="useraddress">Address  :</label>
         <textarea name="" id="" cols="30" rows="10" placeholder="Enter your full address"></textarea><br><br>
         <input type="submit" value="Register">
        </form>
       </div> 
    </main>
   </center> 
</body>
</html>
