<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <center>
        <section>
    <div>
        <form action="" method="post">
            <label for="username">Name  :</label>
            <input type="text" id="username" placeholder="Enter your name"><br><br>
            <label for="usermobile">Mobile  :</label>
            <input type="tel" name="" id="usermobile" placeholder="Enter your mobile" maxlength="10" minlength="10"><br><br>
            <label for="useremail">Email  :</label>
            <input type="email" name="" id="useremail" placeholder="Enter your Email"> <br><br>
            <label for="userpassword">password  :</label>
            <input type="email" name="" id="userpassword" placeholder="Enter your password"><br><br>
            <label for="userage">Age</label>
            <input type="number" id="userage" placeholder="Enter your Age"><br><br>
            <label for="usergender">Gender  :</label>
            <input type="radio" name="gender" id="usergender"> Male
            <input type="radio" name="gender" id="usergender">Female <br><br>
            <label for=" usercourse">course</label>
            <select name="usercourse" id="">
                <option value="">Select your course .......</option>
                <option value="HTML">html</option>
                <option value="css">css</option>
                <option value="React">React</option>
                <option value="Js">Js</option> <br><br>
                <input type="submit" value="submit">
            </select>
        </form>
    </div>
   </section> 
    </center>
</body>
</html>
