<html lang="en">

    <h1>JS - console</h1>
    <h1>Day 2 - Veriables - DataTypes</h1>
<body>
    <script>
        let studentName = "Anbupriya";
        console.log("Student Name:", studentName);
        let age = 20;
        console.log("Age:", age);
        let course = "Full Stack Development";
        console.log("Course:", course);
        let fees = 50000;
        console.log("Fees:", fees);
        let isPlaced = false;
        console.log("Is Placed:", isPlaced);


        let courseName = "React";
        console.log(typeof courseName);
        let marks = 100;
        console.log(typeof marks);
        let percentage = 99.5;
        console.log(typeof percentage);
        let isPassed = true;
        console.log(typeof isPassed);
        let result;
        console.log(typeof result);
        let value = null;
        console.log(typeof value);



        let city = "Chennai";
        console.log("Before Reassignment:", city);
        city = "Bangalore";
        console.log("After Reassignment:", city);


        const companyName = "SLA";
        console.log(companyName);
        companyName = "TCS";
        console.log(companyName);
    </script>
</body>

</html>
